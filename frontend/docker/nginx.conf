server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

  # O pdf.js do visualizador de proposta chega como módulo ES com extensão
  # .mjs, que o mime.types do nginx não conhece: sem isto ele sai como
  # application/octet-stream e o navegador recusa o módulo. O `types { }` zera o
  # mapa só dentro deste location, onde todo arquivo é .mjs, e aí o default_type
  # passa a valer. O nome do arquivo carrega a versão do pdf.js, então ele pode
  # ser cacheado como os arquivos com hash.
  location ~* \.mjs$ {
    types { }
    default_type text/javascript;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # JS e CSS saem do build com hash no nome (outputHashing: all), então podem
  # ser cacheados para sempre.
  location ~* \.(?:js|css)$ {
    # Um único Cache-Control: `expires` emitiria um segundo header, e headers
    # duplicados são interpretados de forma inconsistente por proxies/CDNs.
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Imagens e fontes vêm de public/ sem hash: cache curto, para uma troca de
  # logo não ficar presa no navegador do cliente.
  location ~* \.(?:png|jpe?g|gif|svg|ico|woff2?|ttf|eot)$ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # O index.html nunca é cacheado, senão um deploy novo não chega no usuário.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # As rotas do Angular (/cliente/orcamentos, /404, ...) não existem no disco:
  # o roteamento é no cliente, então tudo cai no index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
