server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass ${API_PROXY_TARGET};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api {
    proxy_pass ${API_PROXY_TARGET};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # A configuração da API pode mudar entre implantações e não tem hash no nome.
  location = /runtime-config.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  # JS e CSS saem do build com hash no nome (outputHashing: all), então podem
  # ser cacheados para sempre.
  location ~* \.(?:js|css)$ {
    # Um único Cache-Control: `expires` emitiria um segundo header, e headers
    # duplicados são interpretados de forma inconsistente por proxies/CDNs.
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Imagens e fontes vêm de public/ sem hash: cache curto, para uma troca de
  # logo não ficar presa no navegador do cliente.
  location ~* \.(?:png|jpe?g|gif|svg|ico|woff2?|ttf|eot)$ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # O index.html nunca é cacheado, senão um deploy novo não chega no usuário.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # As rotas do Angular (/cliente/orcamentos, /404, ...) não existem no disco:
  # o roteamento é no cliente, então tudo cai no index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
