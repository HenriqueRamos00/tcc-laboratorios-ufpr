<figure class="m-0">
  <figcaption class="mb-2 text-center text-base text-lactec-ink-soft">{{ title() }}</figcaption>

  <div class="relative">
    <svg
      [attr.viewBox]="'0 0 ' + chartWidth() + ' ' + chartHeight()"
      class="w-full h-auto"
      role="img"
      [attr.aria-label]="title() + '. Os valores estão na tabela abaixo do gráfico.'"
      (mousemove)="onPointerMove($event)"
      (mouseleave)="onPointerLeave()"
    >
      <!-- Grade recessiva: orienta a leitura sem competir com as linhas. -->
      @for (tick of yAxisTicks(); track tick.value) {
        <line
          [attr.x1]="MARGIN.left"
          [attr.x2]="chartWidth() - MARGIN.right"
          [attr.y1]="tick.y"
          [attr.y2]="tick.y"
          class="stroke-lactec-line"
          stroke-width="1"
        />
        <text
          [attr.x]="MARGIN.left - 8"
          [attr.y]="tick.y + 4"
          text-anchor="end"
          class="fill-lactec-muted"
          font-size="11"
        >
          {{ tick.label }}
        </text>
      }

      @for (tick of xAxisTicks(); track $index) {
        <text
          [attr.x]="tick.x"
          [attr.y]="chartHeight() - MARGIN.bottom + 18"
          [attr.text-anchor]="tick.anchor"
          class="fill-lactec-muted"
          font-size="11"
        >
          {{ tick.label }}
        </text>
      }

      <text
        [attr.x]="chartWidth() / 2"
        [attr.y]="chartHeight() - 6"
        text-anchor="middle"
        class="fill-lactec-muted"
        font-size="11"
      >
        {{ xAxisLabel() }}
      </text>
      <text
        [attr.transform]="'rotate(-90 14 ' + chartHeight() / 2 + ')'"
        [attr.x]="14"
        [attr.y]="chartHeight() / 2"
        text-anchor="middle"
        class="fill-lactec-muted"
        font-size="11"
      >
        {{ yAxisLabel() }}
      </text>

      @if (pointedReading(); as reading) {
        <line
          [attr.x1]="reading.x"
          [attr.x2]="reading.x"
          [attr.y1]="MARGIN.top"
          [attr.y2]="chartHeight() - MARGIN.bottom"
          class="stroke-lactec-faint"
          stroke-width="1"
          stroke-dasharray="4 3"
        />
      }

      @for (serie of plottedSeries(); track serie.key) {
        <path
          [attr.d]="serie.path"
          fill="none"
          [class]="serie.classes.stroke"
          stroke-width="2"
          stroke-linejoin="round"
          stroke-linecap="round"
          [attr.stroke-dasharray]="serie.dashed ? '7 4' : null"
          [style.opacity]="seriesOpacity(serie.key)"
          class="transition-opacity duration-150"
        />
        @for (point of serie.points; track $index) {
          <!-- Anel da superfície separa marcadores que se cruzam. -->
          <path
            [attr.d]="markerPath(serie.shape, point.x, point.y)"
            class="stroke-lactec-paper transition-opacity duration-150"
            [class]="serie.classes.marker"
            stroke-width="2"
            [style.opacity]="seriesOpacity(serie.key)"
          />
        }
      }

      <line
        [attr.x1]="MARGIN.left"
        [attr.x2]="chartWidth() - MARGIN.right"
        [attr.y1]="chartHeight() - MARGIN.bottom"
        [attr.y2]="chartHeight() - MARGIN.bottom"
        class="stroke-lactec-divider"
        stroke-width="1"
      />
    </svg>

    @if (pointedReading(); as reading) {
      <!-- A caixa cresce com o conteúdo e só para de crescer na borda do gráfico: o
           nome do ensaio físico-químico traz a unidade junto e não cabe numa largura
           fixa. Onde nem a borda basta, o nome quebra em duas linhas em vez de
           escapar da caixa. -->
      <div
        class="pointer-events-none absolute top-2 w-fit max-w-[min(28rem,100%)] rounded-lg
               border border-lactec-line bg-lactec-paper/95 px-3 py-2 shadow-lg"
        [style.left.%]="(reading.x / chartWidth()) * 100 > 60 ? null : (reading.x / chartWidth()) * 100 + 2"
        [style.right.%]="(reading.x / chartWidth()) * 100 > 60 ? 100 - (reading.x / chartWidth()) * 100 + 2 : null"
      >
        <p class="m-0 mb-1 text-xs font-semibold text-lactec-ink">{{ reading.label }}</p>
        <!-- Duas colunas só quando o nome é curto o bastante para dividir a caixa com o
             vizinho, que é o caso da fórmula do gás. Com nome longo, a coluna da direita
             era desenhada por cima da esquerda. -->
        <ul
          class="m-0 grid list-none grid-cols-1 gap-x-4 gap-y-0.5 p-0"
          [class]="readingInTwoColumns() ? 'sm:grid-cols-2' : ''"
          aria-label="Valores da data apontada"
        >
          @for (item of reading.values; track item.name) {
            <li class="flex items-baseline gap-2 text-xs">
              <svg
                width="10"
                height="10"
                viewBox="0 0 10 10"
                class="shrink-0 self-center"
                aria-hidden="true"
              >
                <path [attr.d]="markerPath(item.shape, 5, 5)" [class]="item.classes.marker" />
              </svg>
              <span class="text-lactec-muted">{{ item.name }}</span>
              <span class="ml-auto pl-1 font-medium whitespace-nowrap text-lactec-ink">
                {{ formatNumber(item.value) }}
              </span>
            </li>
          }
        </ul>
      </div>
    }
  </div>

  <ul
    class="mt-3 flex list-none flex-wrap items-center justify-center gap-x-4 gap-y-1 p-0"
    aria-label="Legenda do gráfico"
  >
    <li class="text-xs font-semibold text-lactec-muted">Legenda:</li>
    @for (serie of plottedSeries(); track serie.key) {
      <li
        class="flex cursor-default items-center gap-1.5 text-xs text-lactec-ink-soft
               transition-opacity duration-150"
        [style.opacity]="seriesOpacity(serie.key)"
        (mouseenter)="highlightedSeries.set(serie.key)"
        (mouseleave)="highlightedSeries.set(null)"
      >
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
          <path [attr.d]="markerPath(serie.shape, 6, 6)" [class]="serie.classes.marker" />
        </svg>
        {{ serie.name }}
      </li>
    }
  </ul>
</figure>
