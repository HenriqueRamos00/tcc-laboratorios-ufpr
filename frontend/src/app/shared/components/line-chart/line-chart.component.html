<figure class="m-0">
  <figcaption class="mb-2 text-center text-base text-lactec-ink-soft">{{ titulo() }}</figcaption>

  <div class="relative">
    <svg
      [attr.viewBox]="'0 0 ' + LARGURA + ' ' + ALTURA"
      class="w-full h-auto"
      role="img"
      [attr.aria-label]="titulo() + '. Os valores estão na tabela abaixo do gráfico.'"
      (mousemove)="aoMoverPonteiro($event)"
      (mouseleave)="aoSairDoGrafico()"
    >
      <!-- Grade recessiva: orienta a leitura sem competir com as linhas. -->
      @for (marca of marcasDoEixoY(); track marca.valor) {
        <line
          [attr.x1]="MARGEM.esquerda"
          [attr.x2]="LARGURA - MARGEM.direita"
          [attr.y1]="marca.y"
          [attr.y2]="marca.y"
          stroke="#E4E8EA"
          stroke-width="1"
        />
        <text
          [attr.x]="MARGEM.esquerda - 8"
          [attr.y]="marca.y + 4"
          text-anchor="end"
          class="fill-lactec-muted"
          font-size="11"
        >
          {{ marca.rotulo }}
        </text>
      }

      @for (marca of marcasDoEixoX(); track $index) {
        <text
          [attr.x]="marca.x"
          [attr.y]="ALTURA - MARGEM.base + 18"
          text-anchor="middle"
          class="fill-lactec-muted"
          font-size="11"
        >
          {{ marca.rotulo }}
        </text>
      }

      <text
        [attr.x]="LARGURA / 2"
        [attr.y]="ALTURA - 6"
        text-anchor="middle"
        class="fill-lactec-muted"
        font-size="11"
      >
        {{ rotuloDoEixoX() }}
      </text>
      <text
        [attr.transform]="'rotate(-90 14 ' + ALTURA / 2 + ')'"
        [attr.x]="14"
        [attr.y]="ALTURA / 2"
        text-anchor="middle"
        class="fill-lactec-muted"
        font-size="11"
      >
        {{ rotuloDoEixoY() }}
      </text>

      @if (leituraEmFoco(); as foco) {
        <line
          [attr.x1]="foco.x"
          [attr.x2]="foco.x"
          [attr.y1]="MARGEM.topo"
          [attr.y2]="ALTURA - MARGEM.base"
          stroke="#94A4AB"
          stroke-width="1"
          stroke-dasharray="4 3"
        />
      }

      @for (serie of seriesDesenhadas(); track serie.chave) {
        <path
          [attr.d]="serie.caminho"
          fill="none"
          [attr.stroke]="serie.cor"
          stroke-width="2"
          stroke-linejoin="round"
          stroke-linecap="round"
          [attr.stroke-dasharray]="serie.tracejada ? '7 4' : null"
        />
        @for (ponto of serie.pontos; track $index) {
          <!-- Anel da superfície separa marcadores que se cruzam. -->
          <path
            [attr.d]="marcador(serie.forma, ponto.x, ponto.y)"
            [attr.fill]="serie.cor"
            stroke="#FFFFFF"
            stroke-width="2"
          />
        }
      }

      <line
        [attr.x1]="MARGEM.esquerda"
        [attr.x2]="LARGURA - MARGEM.direita"
        [attr.y1]="ALTURA - MARGEM.base"
        [attr.y2]="ALTURA - MARGEM.base"
        stroke="#B8C2C7"
        stroke-width="1"
      />
    </svg>

    @if (leituraEmFoco(); as foco) {
      <div
        class="pointer-events-none absolute top-2 rounded-lg border border-lactec-line
               bg-lactec-paper/95 px-3 py-2 shadow-lg"
        [style.left.%]="(foco.x / LARGURA) * 100 > 60 ? null : (foco.x / LARGURA) * 100 + 2"
        [style.right.%]="(foco.x / LARGURA) * 100 > 60 ? 100 - (foco.x / LARGURA) * 100 + 2 : null"
      >
        <p class="m-0 mb-1 text-xs font-semibold text-lactec-ink">{{ foco.rotulo }}</p>
        <ul class="m-0 grid list-none grid-cols-1 gap-x-4 gap-y-0.5 p-0 sm:grid-cols-2">
          @for (item of foco.valores; track item.nome) {
            <li class="flex items-center gap-2 text-xs whitespace-nowrap">
              <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
                <path [attr.d]="marcador(item.forma, 5, 5)" [attr.fill]="item.cor" />
              </svg>
              <span class="text-lactec-muted">{{ item.nome }}</span>
              <span class="ml-auto font-medium text-lactec-ink">
                {{ formatarNumero(item.valor) }}
              </span>
            </li>
          }
        </ul>
      </div>
    }
  </div>

  <ul class="mt-3 flex list-none flex-wrap justify-center gap-x-4 gap-y-1 p-0">
    @for (serie of seriesDesenhadas(); track serie.chave) {
      <li class="flex items-center gap-1.5 text-xs text-lactec-ink-soft">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
          <path [attr.d]="marcador(serie.forma, 6, 6)" [attr.fill]="serie.cor" />
        </svg>
        {{ serie.nome }}
      </li>
    }
  </ul>
</figure>
