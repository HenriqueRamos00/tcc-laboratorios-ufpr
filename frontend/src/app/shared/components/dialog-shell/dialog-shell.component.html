<ng-template #headerTpl let-closable="closable">
  <header class="dialog-shell__header">
    <div class="dialog-shell__heading">
      @if (title()) {
        <h2 class="dialog-shell__title">{{ title() }}</h2>
      }
      @if (subtitle()) {
        <p class="dialog-shell__subtitle">{{ subtitle() }}</p>
      }
    </div>
    @if (closable) {
      <button
        mat-icon-button
        type="button"
        class="dialog-shell__close"
        (click)="close()"
        aria-label="Fechar"
      >
        <mat-icon>close</mat-icon>
      </button>
    }
  </header>
</ng-template>

<ng-template #contentTpl>
  <div class="dialog-shell__content">
    <ng-content></ng-content>
  </div>
</ng-template>

<ng-template #footerTpl>
  <footer class="dialog-shell__footer">
    <ng-content select="[dialog-footer]"></ng-content>
  </footer>
</ng-template>

@if (isHandset()) {
  <div class="dialog-sheet">
    <div class="dialog-sheet__bar">
      <button
        mat-icon-button
        type="button"
        class="dialog-sheet__close"
        (click)="close()"
        aria-label="Fechar"
      >
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <div class="dialog-sheet__backdrop" (click)="close()">
      <div class="dialog-sheet__panel dialog-shell" (click)="$event.stopPropagation()">
        <ng-container [ngTemplateOutlet]="headerTpl" [ngTemplateOutletContext]="{ closable: false }" />
        <ng-container [ngTemplateOutlet]="contentTpl" />
        <ng-container [ngTemplateOutlet]="footerTpl" />
      </div>
    </div>
  </div>
} @else {
  <div class="dialog-shell">
    <ng-container [ngTemplateOutlet]="headerTpl" [ngTemplateOutletContext]="{ closable: true }" />
    <ng-container [ngTemplateOutlet]="contentTpl" />
    <ng-container [ngTemplateOutlet]="footerTpl" />
  </div>
}
