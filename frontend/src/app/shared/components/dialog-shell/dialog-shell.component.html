<ng-template #headerTpl let-closable="closable">
  <header class="flex items-start justify-between gap-lactec-panel-gap">
    <div class="flex min-w-0 flex-col gap-1">
      @if (title()) {
        <h2
          class="font-display text-2xl font-semibold tracking-display text-lactec-ink outline-none"
          [class.-mt-1]="closable"
        >{{ title() }}</h2>
      }
      @if (subtitle()) {
        <p class="text-[13px] text-lactec-muted">{{ subtitle() }}</p>
      }
    </div>
    @if (closable) {
      <button
        mat-icon-button
        type="button"
        class="dialog-shell__close -mt-2 -mr-2 flex-none"
        (click)="close()"
        aria-label="Fechar"
      >
        <mat-icon>close</mat-icon>
      </button>
    }
  </header>
</ng-template>

<ng-template #contentTpl>
  <div class="flex flex-col gap-lactec-panel-gap">
    <ng-content></ng-content>
  </div>
</ng-template>

<ng-template #footerTpl>
  <footer class="flex border-t border-lactec-line pt-lactec-panel-gap empty:hidden">
    <ng-content select="[dialog-footer]"></ng-content>
  </footer>
</ng-template>

@if (isHandset()) {
  <div class="flex h-dvh flex-col">
    <div class="dialog-sheet__bar flex h-14 flex-none items-center justify-end bg-lactec-primary-deep px-1">
      <button
        mat-icon-button
        type="button"
        class="dialog-sheet__close"
        (click)="close()"
        aria-label="Fechar"
      >
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <div class="flex min-h-0 flex-auto cursor-pointer flex-col justify-end overflow-clip bg-lactec-ink/55" (click)="close()">
      <div
        class="flex max-h-full flex-none animate-sheet-up cursor-default flex-col gap-lactec-panel-gap overflow-y-auto
               bg-lactec-paper p-lactec-panel"
        (click)="$event.stopPropagation()"
      >
        <ng-container [ngTemplateOutlet]="headerTpl" [ngTemplateOutletContext]="{ closable: false }" />
        <ng-container [ngTemplateOutlet]="contentTpl" />
        <ng-container [ngTemplateOutlet]="footerTpl" />
      </div>
    </div>
  </div>
} @else {
  <div class="flex flex-col gap-lactec-panel-gap p-lactec-panel">
    <ng-container [ngTemplateOutlet]="headerTpl" [ngTemplateOutletContext]="{ closable: true }" />
    <ng-container [ngTemplateOutlet]="contentTpl" />
    <ng-container [ngTemplateOutlet]="footerTpl" />
  </div>
}
