<app-page-header title="Listagem de Equipamentos" />

<app-search-field
  class="mt-6"
  placeholder="Buscar por Número de Série ou TAG"
  label="Buscar por número de série ou TAG"
  [maxLength]="searchMaxLength"
  [(termo)]="searchTerm"
/>

@if (unavailable()) {
  <app-empty-state
    class="mt-6"
    icon="info"
    title="Consulta de equipamentos indisponível"
    descricao="A consulta de equipamentos e indicadores ainda não está disponível neste ambiente."
  />
} @else if (failed()) {
  <app-empty-state
    class="mt-6"
    tom="erro"
    icon="cloud_off"
    title="Não foi possível carregar os equipamentos no momento"
    descricao="A consulta falhou. Tente novamente em instantes."
  />
} @else {
  <app-data-table
    class="mt-6"
    caption="Equipamentos da sua empresa, com número de série, TAG, tipo, número de laudos e acesso aos detalhes de cada um."
    paginationLabel="Paginação da listagem de equipamentos"
    actionsHeader="Ação"
    loadingMessage="Carregando equipamentos…"
    emptyIcon="search_off"
    emptyTitle="Nenhum equipamento encontrado"
    [emptyDescription]="emptyDescription()"
    [columns]="columns"
    [rows]="equipmentList()"
    [trackBy]="trackById"
    [total]="total()"
    [loading]="loading()"
    [(query)]="query"
  >
    <ng-template appDataTableActions [appDataTableActionsOf]="equipmentList()" let-equipment>
      <a
        [routerLink]="['/cliente/equipamentos', equipment.id]"
        class="inline-flex items-center gap-2 rounded-lg bg-lactec-primary px-4 py-2
               text-sm font-semibold text-lactec-on-primary hover:bg-lactec-primary-dark"
      >
        Ver Detalhes
        <mat-icon class="icone-16" aria-hidden="true">arrow_forward</mat-icon>
      </a>
    </ng-template>
  </app-data-table>
}
