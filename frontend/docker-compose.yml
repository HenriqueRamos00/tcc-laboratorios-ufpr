# Depois de mexer em package.json, recrie os volumes anônimos, senão o
# node_modules antigo continua montado por cima do novo:
#   docker compose up --build --renew-anon-volumes
#
# O navegador usa /api na origem do portal. O proxy encaminha as chamadas
# ao Spring no endereço definido por API_PROXY_TARGET.

services:
  web:
    build:
      context: .
      target: dev
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://host.docker.internal:8080}
    ports:
      - "${PORTAL_WEB_PORT:-4200}:4200"
    volumes:
      - .:/app
      # Sem os volumes anônimos, o bind mount acima esconde o node_modules
      # instalado no build.
      - /app/node_modules
      - /app/.angular
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Em alguns bind mounts o inotify não propaga e o hot reload não dispara.
    # Nesse caso: npx ng serve --host 0.0.0.0 --port 4200 --poll 2000
    stdin_open: true
    tty: true

  web-prod:
    profiles: ["prod"]
    build:
      context: .
      target: prod
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://host.docker.internal:8080}
      NGINX_ENVSUBST_FILTER: "^API_PROXY_TARGET$$"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PORTAL_WEB_PROD_PORT:-8082}:80"
    restart: unless-stopped
