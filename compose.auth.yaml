# Demonstração local: docker compose -f compose.auth.yaml up -d --build
name: tcc-auth-demo

# Valores públicos exclusivos do demo; substituíveis pelo .env da raiz.
x-demo-service-token: &demo-service-token ${BACKEND_AUTH_SERVICE_TOKEN:-svc_abcdefghijklmnopqrstuvwxyz0123456789ABCDEFG}
x-demo-schema-password: &demo-schema-password ${AUTH_SCHEMA_OWNER_PASSWORD:-AuthOwner!9mR4tL7wQ2nK}
x-demo-app-password: &demo-app-password ${AUTH_DATASOURCE_PASSWORD:-AuthApp!3pV8sN6xH5rT}
x-auth-context: &auth-context
  SPRING_DATASOURCE_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
  AUTH_SCHEMA: AUTH_OWNER

services:
  oracle:
    image: gvenzl/oracle-free:slim-faststart
    environment:
      ORACLE_PASSWORD: ${AUTH_ORACLE_PASSWORD:-OracleDemo!7qN2vK9mR4sT}
      ORACLE_PDB: FREEPDB1
      AUTH_SCHEMA_OWNER_USERNAME: auth_owner
      AUTH_SCHEMA_OWNER_PASSWORD: *demo-schema-password
      AUTH_APPLICATION_USERNAME: auth_app
      AUTH_APPLICATION_PASSWORD: *demo-app-password
    shm_size: 1g
    volumes:
      - auth-oracle-data:/opt/oracle/oradata
      - ./backend-auth2/docker/oracle/init:/container-entrypoint-startdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh && test -f /tmp/auth-schema-users-ready"]
      interval: 10s
      timeout: 10s
      retries: 40
      start_period: 180s
    mem_limit: 4g

  auth-migrate:
    build:
      context: ./backend-auth2
    image: tcc-auth-demo-backend-auth2
    environment:
      <<: *auth-context
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      SPRING_DATASOURCE_USERNAME: auth_owner
      SPRING_DATASOURCE_PASSWORD: *demo-schema-password
    depends_on:
      oracle:
        condition: service_healthy
    mem_limit: 768m

  backend-auth2:
    build:
      context: ./backend-auth2
    image: tcc-auth-demo-backend-auth2
    environment:
      <<: *auth-context
      SERVER_PORT: 8081
      SPRING_DATASOURCE_USERNAME: auth_app
      SPRING_DATASOURCE_PASSWORD: *demo-app-password
      SPRING_FLYWAY_ENABLED: "false"
      AUTH_DEMO_SEED_ENABLED: "true"
      AUTH_DEMO_ADMIN_PASSWORD: ${AUTH_DEMO_ADMIN_PASSWORD:-Lactec!7uQ2mN9xR4pK}
      AUTH_DEMO_CLIENT1_PASSWORD: ${AUTH_DEMO_CLIENT1_PASSWORD:-Cliente1!6vT9qL2nW8sD}
      AUTH_DEMO_CLIENT2_PASSWORD: ${AUTH_DEMO_CLIENT2_PASSWORD:-Cliente2!3rK7wP5mH9zF}
      BACKEND_AUTH_SERVICE_TOKEN: *demo-service-token
      SERVICE_TOKEN_EXPIRATION_SECONDS: ${SERVICE_TOKEN_EXPIRATION_SECONDS:-2592000}
    ports:
      - "127.0.0.1:${AUTH_PORT:-8081}:8081"
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 768m

  portal-api:
    build:
      context: ./backend-portal-web
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Portal__DataSource: lactec
      Portal__UseDemoData: "true"
      LabResults__Source: embedded-sample
      LabResults__DevelopmentTenant: ""
      BackendAuth__BaseUrl: http://backend-auth2:8081
      BackendAuth__ServiceToken: *demo-service-token
      BackendAuth__ServiceCode: portal-web
      PortalJwt__Issuer: ${PORTAL_JWT_ISSUER:-portal-api}
      PortalJwt__Audience: ${PORTAL_JWT_AUDIENCE:-portal-web}
      PortalJwt__SigningKey: ${PORTAL_JWT_SIGNING_KEY:-bGFjdGVjLWRlbW8tand0LWtleS0zMi1ieXRlcy1vbmx5IQ==}
      PortalJwt__ExpirationSeconds: ${PORTAL_JWT_EXPIRATION_SECONDS:-900}
    ports:
      - "127.0.0.1:5125:8080"
    depends_on:
      backend-auth2:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "127.0.0.1:4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.angular
    depends_on:
      portal-api:
        condition: service_started
    stdin_open: true
    tty: true

volumes:
  auth-oracle-data:
