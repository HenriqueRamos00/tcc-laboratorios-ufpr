# Demonstração local: docker compose -f compose.auth.yaml up -d --build
name: tcc-auth-demo

# Segredos públicos apenas para este ambiente local; substituíveis pelo .env da raiz.
x-demo-service-token: &demo-service-token ${BACKEND_AUTH_SERVICE_TOKEN:-svc_abcdefghijklmnopqrstuvwxyz0123456789ABCDEFG}
x-demo-sql-password: &demo-sql-password ${SQLSERVER_SA_PASSWORD:-LactecDemo2026!}

services:
  sqlserver:
    restart: unless-stopped
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: *demo-sql-password
    volumes:
      - auth-sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b
          -Q "SELECT COUNT(*) FROM tempdb.sys.tables; IF DB_ID(N'backend_auth') IS NOT NULL EXEC(N'USE [backend_auth]; SELECT 1');"
          -o /dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  database-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd"]
    command: ["-S", "sqlserver", "-U", "sa", "-C", "-b", "-Q", "IF DB_ID(N'backend_auth') IS NULL CREATE DATABASE [backend_auth]"]
    environment:
      SQLCMDPASSWORD: *demo-sql-password
    depends_on:
      sqlserver:
        condition: service_healthy

  autolab-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        for arquivo in /sql/01-create-database.sql /sql/02-create-objects.sql /sql/03-load-sample.sql; do
          /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -C -b -f 65001 -i "$$arquivo" || exit 1;
        done
    environment:
      SQLCMDPASSWORD: *demo-sql-password
    volumes:
      - ./backend-portal-web/docker/autolab:/sql:ro
    depends_on:
      sqlserver:
        condition: service_healthy

  backend-auth:
    restart: unless-stopped
    build:
      context: ./backend-auth
    environment:
      SERVER_PORT: 8080
      DB_URL: "jdbc:sqlserver://sqlserver:1433;databaseName=backend_auth;encrypt=true;trustServerCertificate=true"
      DB_USERNAME: sa
      DB_PASSWORD: *demo-sql-password
      JPA_DDL_AUTO: update
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:${AUTH_PORT:-8081}}
      AUTH_DEMO_SEED_ENABLED: "true"
      BACKEND_AUTH_SERVICE_TOKEN: *demo-service-token
      SERVICE_TOKEN_EXPIRATION_SECONDS: ${SERVICE_TOKEN_EXPIRATION_SECONDS:-2592000}
    ports:
      - "127.0.0.1:${AUTH_PORT:-8081}:8080"
    depends_on:
      database-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  portal-api:
    restart: unless-stopped
    build:
      context: ./backend-portal-web
    env_file:
      # Local defaults first; the user's AutoLAB connection takes precedence.
      - path: ./backend-portal-web/docker/autolab/demo.env
      - path: ./backend-portal-web/.env
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Portal__DataSource: lactec
      # true (padrão): orçamentos de demonstração. false: Salesforce real, com as
      # credenciais Salesforce__* de backend-portal-web/.env.
      Portal__UseDemoData: ${PORTAL_USE_DEMO_DATA:-true}
      LabResults__Source: sql-server
      LabResults__Scope: all
      LabResults__DevelopmentTenant: ""
      EquipmentRegistry__Source: sql-server
      LaboratoryProgress__Source: sql-server
      ReportDocuments__Source: sql-server
      BackendAuth__BaseUrl: http://backend-auth:8080
      BackendAuth__ServiceToken: *demo-service-token
      BackendAuth__ServiceCode: portal-web
      PortalJwt__Issuer: ${PORTAL_JWT_ISSUER:-portal-api}
      PortalJwt__Audience: ${PORTAL_JWT_AUDIENCE:-portal-web}
      PortalJwt__SigningKey: ${PORTAL_JWT_SIGNING_KEY:-bGFjdGVjLWRlbW8tand0LWtleS0zMi1ieXRlcy1vbmx5IQ==}
      PortalJwt__ExpirationSeconds: ${PORTAL_JWT_EXPIRATION_SECONDS:-900}
    ports:
      - "127.0.0.1:5125:8080"
    depends_on:
      backend-auth:
        condition: service_healthy
      autolab-init:
        condition: service_completed_successfully

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      target: dev
    ports:
      - "127.0.0.1:4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.angular
    depends_on:
      portal-api:
        condition: service_started
    stdin_open: true
    tty: true

volumes:
  auth-sqlserver-data:
