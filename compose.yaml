name: tcc-laboratorios

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-backend_lab}
      POSTGRES_USER: ${POSTGRES_USER:-backend_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backend_lab}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - backend-lab-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-lab:
    build:
      context: ./backend-lab
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-backend_lab}
      DB_USERNAME: ${POSTGRES_USER:-backend_lab}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-backend_lab}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-with-at-least-32-characters}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-false}
      AUTH_SEED_ADMIN_NAME: ${AUTH_SEED_ADMIN_NAME:-}
      AUTH_SEED_ADMIN_EMAIL: ${AUTH_SEED_ADMIN_EMAIL:-}
      AUTH_SEED_ADMIN_PASSWORD: ${AUTH_SEED_ADMIN_PASSWORD:-}
      AUTH_SEED_TECHNICIAN_NAME: ${AUTH_SEED_TECHNICIAN_NAME:-}
      AUTH_SEED_TECHNICIAN_EMAIL: ${AUTH_SEED_TECHNICIAN_EMAIL:-}
      AUTH_SEED_TECHNICIAN_PASSWORD: ${AUTH_SEED_TECHNICIAN_PASSWORD:-}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_SENDER: ${SPRING_MAIL_SENDER:-}
      SPRING_MAIL_AUTH: ${SPRING_MAIL_AUTH:-true}
      SPRING_MAIL_STARTTLS_ENABLE: ${SPRING_MAIL_STARTTLS_ENABLE:-true}
      SPRING_MAIL_STARTTLS_REQUIRED: ${SPRING_MAIL_STARTTLS_REQUIRED:-true}
      INTERNAL_PORTAL_EMAIL_CHANGE_LINK: ${INTERNAL_PORTAL_EMAIL_CHANGE_LINK:-http://localhost:4201/confirmar-alteracao-email?token={token}}
      CLIENT_PORTAL_EMAIL_CHANGE_LINK: ${CLIENT_PORTAL_EMAIL_CHANGE_LINK:-http://localhost:4200/confirmar-alteracao-email?token={token}}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  portal-api:
    build:
      context: ./backend-portal-web
    env_file:
      - path: ./backend-portal-web/.env
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Portal__DataSource: backend-lab
      BackendLab__BaseUrl: ${BACKEND_LAB_BASE_URL:-http://backend-lab:8080}
      LabResults__Source: backend-lab
      EquipmentRegistry__Source: backend-lab
      LaboratoryProgress__Source: not-connected
      ReportDocuments__Source: not-connected
    ports:
      - "${PORTAL_API_PORT:-5125}:8080"

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.angular
    depends_on:
      portal-api:
        condition: service_started
    stdin_open: true
    tty: true

  frontend-interno:
    build:
      context: ./frontend-interno
      target: dev
    environment:
      API_PROXY_TARGET: http://backend-lab:8080
    ports:
      - "${PORTAL_INTERNO_DEV_PORT:-4201}:4201"
    volumes:
      - ./frontend-interno:/app
      - /app/node_modules
      - /app/.angular
    depends_on:
      backend-lab:
        condition: service_healthy
    stdin_open: true
    tty: true

  app-android:
    profiles: [android]
    network_mode: host
    build:
      context: ./app-android
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    working_dir: /workspace
    environment:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      ADB_DEVICE: ${ADB_DEVICE:-}
      ADB_REVERSE_PORT: ${ADB_REVERSE_PORT:-5125}
      PORTAL_API_URL: ${ANDROID_PORTAL_API_URL:-}
    volumes:
      - ./app-android:/workspace
      - app-android-gradle-home:/home/dev/.gradle
      - app-android-adb-home:/home/dev/.android
    stdin_open: true
    tty: true

volumes:
  backend-lab-postgres-data:
    name: ${LAB_POSTGRES_VOLUME:-tcc-laboratorios-postgres}
  app-android-gradle-home:
  app-android-adb-home:
