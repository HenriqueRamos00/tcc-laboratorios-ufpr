spring.application.name=backend-lab
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/backend_lab}
spring.datasource.username=${DB_USERNAME:backend_lab}
spring.datasource.password=${DB_PASSWORD:backend_lab}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

security.jwt.secret=${JWT_SECRET:backend-lab-development-secret-change-in-production-2026}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

auth.seed.admin.name=${AUTH_SEED_ADMIN_NAME:}
auth.seed.admin.email=${AUTH_SEED_ADMIN_EMAIL:}
auth.seed.admin.password=${AUTH_SEED_ADMIN_PASSWORD:}
auth.seed.technician.name=${AUTH_SEED_TECHNICIAN_NAME:}
auth.seed.technician.email=${AUTH_SEED_TECHNICIAN_EMAIL:}
auth.seed.technician.password=${AUTH_SEED_TECHNICIAN_PASSWORD:}
