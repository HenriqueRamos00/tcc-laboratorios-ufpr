spring.datasource.url=jdbc:h2:mem:backend_lab;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

security.jwt.secret=test-secret-with-at-least-32-characters-long
security.jwt.expiration-seconds=3600
# Identifica quem emite o token interno.
security.jwt.issuer=tcc-backend-lab
# Identifica o destino previsto do token interno.
security.jwt.audience=tcc-backend-lab-internal
# Tolerância entre relógios dos serviços, em segundos.
security.jwt.clock-skew-seconds=30

# Mantém o contrato de status estrito também no contexto de testes.
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true
