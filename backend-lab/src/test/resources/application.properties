spring.datasource.url=jdbc:h2:mem:backend_lab;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

security.jwt.secret=test-secret-with-at-least-48-characters-for-hs384-validation
security.jwt.expiration-seconds=3600

# Mantém o contrato de status estrito também no contexto de testes.
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true
