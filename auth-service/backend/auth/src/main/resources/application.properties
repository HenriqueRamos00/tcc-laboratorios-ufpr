spring.application.name=auth
server.port=${AUTH_PORT:9000}
server.servlet.session.timeout=${AUTH_SESSION_TIMEOUT:15m}
server.servlet.session.cookie.name=AUTH_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${AUTH_COOKIE_SECURE:false}

spring.datasource.url=${AUTH_DB_URL}
spring.datasource.username=${AUTH_DB_USERNAME}
spring.datasource.password=${AUTH_DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

auth.issuer=${AUTH_ISSUER}
auth.key-store=${AUTH_KEY_STORE}
auth.key-store-password=${AUTH_KEY_STORE_PASSWORD}
auth.portal-client-secret=${AUTH_PORTAL_CLIENT_SECRET}
auth.portal-redirect-uri=${AUTH_PORTAL_REDIRECT_URI}
auth.portal-logout-redirect-uri=${AUTH_PORTAL_LOGOUT_REDIRECT_URI}
auth.setup-token=${AUTH_SETUP_TOKEN:}
