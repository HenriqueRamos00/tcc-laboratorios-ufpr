spring.application.name=auth
server.port=${AUTH_PORT:9000}
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${AUTH_COOKIE_SECURE:true}

spring.datasource.url=${AUTH_DB_URL}
spring.datasource.username=${AUTH_DB_USERNAME}
spring.datasource.password=${AUTH_DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.sql.init.mode=never

auth.issuer=${AUTH_ISSUER}
auth.key-store=${AUTH_KEY_STORE}
auth.key-store-password=${AUTH_KEY_STORE_PASSWORD}
auth.portal-client-secret=${AUTH_PORTAL_CLIENT_SECRET}
auth.portal-redirect-uri=${AUTH_PORTAL_REDIRECT_URI}
auth.portal-logout-redirect-uri=${AUTH_PORTAL_LOGOUT_REDIRECT_URI}

auth.bootstrap.email=${AUTH_BOOTSTRAP_EMAIL:}
auth.bootstrap.username=${AUTH_BOOTSTRAP_USERNAME:}
auth.bootstrap.password=${AUTH_BOOTSTRAP_PASSWORD:}
auth.bootstrap.service=${AUTH_BOOTSTRAP_SERVICE:}
auth.bootstrap.service-id=${AUTH_BOOTSTRAP_SERVICE_ID:}
