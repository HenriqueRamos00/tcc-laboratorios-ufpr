spring.datasource.url=jdbc:h2:mem:auth;MODE=MSSQLServer;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
auth.issuer=http://localhost:9000
auth.portal-client-secret=test-client-secret-with-at-least-32-characters
auth.portal-redirect-uri=http://localhost:5125/signin-oidc
auth.portal-logout-redirect-uri=http://localhost:5125/signout-callback-oidc
auth.bootstrap.email=

logging.level.root=WARN
debug=false
spring.main.banner-mode=off
