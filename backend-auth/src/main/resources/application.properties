spring.application.name=backend-auth
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=backend_auth;encrypt=true;trustServerCertificate=false}
spring.datasource.username=${DB_USERNAME:backend_auth}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true

app.base-url=${APP_BASE_URL:http://localhost:${server.port}}
admin.token.expiration-seconds=${ADMIN_TOKEN_EXPIRATION_SECONDS:3600}
service.token.expiration-seconds=${SERVICE_TOKEN_EXPIRATION_SECONDS:2592000}
client.login.cooldown-seconds=${CLIENT_LOGIN_COOLDOWN_SECONDS:900}
demo.seed.enabled=${AUTH_DEMO_SEED_ENABLED:false}
demo.seed.service-token=${BACKEND_AUTH_SERVICE_TOKEN:}

springdoc.override-with-generic-response=false
springdoc.default-produces-media-type=application/json
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.tags-sorter=alpha
